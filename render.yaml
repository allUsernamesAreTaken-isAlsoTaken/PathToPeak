# Render Blueprint specification for PathToPeak
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. Express API Backend (Web Service)
  - type: web
    name: pathtopeak-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: pathtopeak-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

  # 2. React + Vite Frontend (Static Site)
  - type: web
    name: pathtopeak-frontend
    runtime: static
    buildCommand: npm install && npm run build:frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        fromService:
          type: web
          name: pathtopeak-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: pathtopeak-db
    databaseName: pathtopeak
    user: pathtopeak_user
    plan: free
